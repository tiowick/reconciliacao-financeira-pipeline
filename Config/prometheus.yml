global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'financeiro-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['financeiro-api:8080']

  - job_name: 'financeiro-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['financeiro-worker:8080']